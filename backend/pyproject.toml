[project]
name = "dnd-portal-backend"
version = "0.1.0"
description = "REST API and database for the DnD Portal"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.4",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "alembic==1.20.0",
]

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pylint==4.1.3",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "vulture==2.16",
    "xenon==0.9.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PIE", "RET"]
# B008: FastAPI resolves dependencies via `Depends(...)` in argument defaults; this is the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.mccabe]
# Baseline (DND-31): highest current value (app/api/routes/ws.py `game_table_socket`). Lower it, never raise it.
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.vulture]
# 60 instead of the default 80: only at 60 does vulture report unused functions, classes and attributes (DND-31).
paths = ["app", "migrations", "scripts", "tests", "vulture_whitelist.py", "vulture_baseline.py"]
min_confidence = 60
# Used indirectly: FastAPI routes, Pydantic validators, pytest fixtures.
ignore_decorators = ["@router.*", "@field_validator", "@model_validator", "@pytest.fixture"]
# Read by frameworks: Pydantic `model_config`, Alembic revision identifiers, pytest `pytestmark`.
ignore_names = ["model_config", "revision", "down_revision", "branch_labels", "depends_on", "pytestmark"]

[tool.deptry]
known_first_party = ["app"]

[tool.deptry.per_rule_ignores]
# DEP002 (declared but not imported): uvicorn is the server started by the Dockerfile/compose command, psycopg2-binary
# is the database driver SQLAlchemy loads from the URL (`postgresql+psycopg2`).
DEP002 = ["uvicorn", "psycopg2-binary"]
# DEP003 (transitive import), baseline (DND-31): app/realtime/push.py imports starlette, which comes with fastapi.
DEP003 = ["starlette"]

[tool.pylint.main]
# Only duplicate detection (DND-31); ruff remains the linter.
disable = ["all"]
enable = ["duplicate-code"]
fail-under = 10

[tool.pylint.similarities]
min-similarity-lines = 8
