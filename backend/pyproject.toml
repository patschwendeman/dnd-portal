[project]
name = "dnd-portal-backend"
version = "0.1.0"
description = "REST API and database for the DnD Portal"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.4",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: FastAPI resolves dependencies via `Depends(...)` in argument defaults; this is the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
