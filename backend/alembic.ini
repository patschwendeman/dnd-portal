# Alembic configuration (see backend/CLAUDE.md, section "Migrationen").
# The database URL is not set here: migrations/env.py takes it from app.core.config.settings.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Migration files are named <revision>_<slug>.py; new revisions get a numeric ID via --rev-id (e.g. 0002).
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Format and lint-fix new revision files with ruff (dev dependency), so that they pass `ruff check`/`ruff format`.
hooks = ruff_format, ruff_fix
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
