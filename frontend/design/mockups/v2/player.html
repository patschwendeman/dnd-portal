<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Player Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Theme-Farben: unverändert aus darkTheme.ts */
  --secondary: #161b23; --background: #0e1117; --text: #f0f6fc;
  /* Ressourcenfarben: unverändert aus ResourceBarPlayer.tsx */
  --action: #077600; --action-muted: #072900;
  --bonus: #b23700; --bonus-muted: #290e00;
  --movement: #fae100; --movement-muted: #292500;
  --spell: #2487ff; --spell-muted: #001229;
  --special: #ff2424; --special-muted: #290000;
  --empty: #232321; --value: #9e998a;

  /* Tokens aus DESIGN.md */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-pill: 999px;
  --border-thick: 2px; --control-md: 40px; --icon: 20px;

  /* neu für den Player (Vorschlag) */
  --control-lg: 64px;   /* Ressourcen-Button: große Tippfläche */
  --slot-w: 8px; --slot-h: 24px;
  /* Abstand zum Rand: max(space.5, Safe Area). Im Mockup ohne Notch = 24px */
  --edge: max(var(--space-5), env(safe-area-inset-left));
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: var(--font); font-size: 16px; line-height: 24px; background: var(--background); color: var(--text);
  -webkit-font-smoothing: antialiased; user-select: none; }
svg { width: 100%; height: 100%; fill: var(--text); }

.screen { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: var(--space-4);
  padding: var(--space-4) var(--edge); }
/* Kopfleiste: transparent, gleiche Breite wie die Karte, Settings-Button links bündig mit der Karte */
.headbar { height: var(--control-md); display: flex; align-items: center; justify-content: flex-start; }
.icon-btn { width: var(--control-md); height: var(--control-md); display: grid; place-items: center; border: none;
  border-radius: var(--radius-md); background: var(--secondary); color: var(--text); }
.icon-btn svg { width: var(--icon); height: var(--icon); }

.card { background: var(--secondary); border-radius: var(--radius-lg); padding: var(--space-4);
  display: flex; flex-direction: column; gap: var(--space-4); }
.row { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: var(--space-3); row-gap: var(--space-2); }
.cell { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.label { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.row .label.span { grid-column: 1 / -1; }

.res { height: var(--control-lg); display: flex; align-items: center; justify-content: center; gap: var(--space-3);
  border: var(--border-thick) solid; border-radius: var(--radius-lg); color: var(--value);
  font-size: 24px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
.res.static { cursor: default; }
.action { border-color: var(--action); background: var(--action-muted); }
.bonus { border-color: var(--bonus); background: var(--bonus-muted); }
.movement { border-color: var(--movement); background: var(--movement-muted); }
.spell { border-color: var(--spell); background: var(--spell-muted); }
.special { border-color: var(--special); background: var(--special-muted); }

.ico { width: var(--icon); height: var(--icon); display: grid; place-items: center; }
.dot { width: var(--icon); height: var(--icon); border-radius: 50%; }
.tri { width: 0; height: 0; border-style: solid; border-width: 0 10px 18px 10px; border-color: transparent; }
.dots { display: flex; gap: var(--space-1); }
.dots i { width: var(--space-2); height: var(--space-2); border-radius: 50%; background: var(--movement); }
.slots { display: flex; gap: var(--space-1); }
.slots i { width: var(--slot-w); height: var(--slot-h); border-radius: 2px; background: var(--empty); }
.res.spell { justify-content: space-between; padding: 0 var(--space-4); }
.numeral { font-size: 20px; line-height: 28px; font-weight: 600; }

/* Hinweis im Hochformat */
.rotate { position: fixed; inset: 0; display: none; place-content: center; justify-items: center; gap: var(--space-4);
  padding: var(--space-5); background: var(--background); text-align: center; }
.rotate .phone { width: 96px; height: 96px; }
.rotate p { font-size: 16px; line-height: 24px; font-weight: 500; }
@media (max-width: 649px) { .rotate { display: grid; } }
</style></head><body>
<div class="screen">
  <header class="headbar"><button class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" id="settings">
  <path fill="currentColor" d="M2.26726 6.15309C2.52898 5.34715 2.96011 4.60735 3.52898 3.98039C3.62517 3.87437 3.77609 3.83658 3.91121 3.88469L5.27069 4.36869C5.63926 4.49984 6.04482 4.30865 6.17653 3.94166C6.18948 3.90557 6.19946 3.8685 6.20635 3.83086L6.46535 2.41533C6.4911 2.27459 6.59966 2.16326 6.74019 2.13347C7.15137 2.04633 7.57295 2.00201 8.00006 2.00201C8.42691 2.00201 8.84824 2.04628 9.25918 2.13331C9.39967 2.16307 9.50822 2.27433 9.53403 2.41502L9.79376 3.8308C9.86398 4.21419 10.233 4.46831 10.6181 4.3984C10.656 4.39152 10.6932 4.38159 10.7294 4.36871L12.0889 3.88469C12.224 3.83658 12.3749 3.87437 12.4711 3.98039C13.04 4.60735 13.4711 5.34715 13.7329 6.15309C13.777 6.28905 13.7344 6.43811 13.625 6.53059L12.5231 7.46211C12.2248 7.71436 12.1883 8.15967 12.4416 8.45674C12.4665 8.48595 12.4938 8.51309 12.5231 8.53788L13.625 9.46941C13.7344 9.56189 13.777 9.71095 13.7329 9.84692C13.4711 10.6529 13.04 11.3927 12.4711 12.0196C12.3749 12.1256 12.224 12.1634 12.0889 12.1153L10.7294 11.6313C10.3609 11.5002 9.9553 11.6914 9.82359 12.0583C9.81064 12.0944 9.80066 12.1315 9.79374 12.1693L9.53403 13.585C9.50822 13.7257 9.39967 13.8369 9.25918 13.8667C8.84824 13.9537 8.42691 13.998 8.00006 13.998C7.57295 13.998 7.15137 13.9537 6.74019 13.8665C6.59966 13.8367 6.4911 13.7254 6.46535 13.5847L6.20636 12.1692C6.13614 11.7858 5.76708 11.5317 5.38203 11.6016C5.34416 11.6085 5.30693 11.6184 5.27075 11.6313L3.91121 12.1153C3.77609 12.1634 3.62517 12.1256 3.52898 12.0196C2.96011 11.3927 2.52898 10.6529 2.26726 9.84692C2.22311 9.71095 2.26568 9.56189 2.37509 9.46941L3.47699 8.53789C3.77534 8.28564 3.81183 7.84033 3.5585 7.54326C3.53359 7.51405 3.50633 7.48691 3.477 7.46212L2.37509 6.53059C2.26568 6.43811 2.22311 6.28905 2.26726 6.15309ZM6.24994 7.99994C6.24994 8.96644 7.03344 9.74994 7.99994 9.74994C8.96644 9.74994 9.74994 8.96644 9.74994 7.99994C9.74994 7.03344 8.96644 6.24994 7.99994 6.24994C7.03344 6.24994 6.24994 7.03344 6.24994 7.99994Z"></path>
</svg>
</button></header>
  <div class="card">
    <div class="row">
      <div class="cell"><span class="label">Aktion</span>
        <div class="res action"><span class="ico"><span class="dot" style="background: var(--action)"></span></span>1</div></div>
      <div class="cell"><span class="label">Bonusaktion</span>
        <div class="res bonus"><span class="ico"><span class="tri" style="border-bottom-color: var(--empty)"></span></span>0</div></div>
      <div class="cell"><span class="label">Bewegung</span>
        <div class="res movement static"><span class="ico"><span class="dots"><i></i><i></i></span></span>9.5</div></div>
      <div class="cell"><span class="label">Spezial</span>
        <div class="res special"><span class="slots"><i style="background: var(--special)"></i><i></i><i></i></span></div></div>
    </div>
    <div class="row">
      <span class="label span">Zauberplätze</span>
      <div class="res spell"><span class="numeral">I</span><span class="slots"><i style="background: var(--spell)"></i><i style="background: var(--spell)"></i><i style="background: var(--spell)"></i><i></i></span></div><div class="res spell"><span class="numeral">II</span><span class="slots"><i style="background: var(--spell)"></i><i style="background: var(--spell)"></i><i style="background: var(--spell)"></i></span></div><div class="res spell"><span class="numeral">III</span><span class="slots"><i style="background: var(--spell)"></i><i></i><i></i></span></div><div class="res spell"><span class="numeral">IV</span><span class="slots"><i></i><i></i></span></div>
    </div>
  </div>
</div>
<div class="rotate"><span class="phone"><svg   viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="currentColor" stroke="#000000"><rect x="18" y="8" width="28" height="48" rx="4"/><line x1="28" y1="12" x2="36" y2="12"/><line x1="30" y1="52" x2="34" y2="52"/></svg></span><p>Bitte das Handy quer halten</p></div>
</body></html>
