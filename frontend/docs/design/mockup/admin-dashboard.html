<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin-Dashboard Entwürfe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Seite mit Steuerleiste oben, darunter ein maßstabsgetreuer Admin-Rahmen (Höhe 1080p) und die Erläuterung der Variante.
   Farben 1:1 aus darkTheme.ts / tavernTheme.ts, Abstände aus tokens.ts. Bewusst nur dunkel, wie die App selbst. */
:root {
  color-scheme: dark;
  --page: #07090d;
  --bg: #0e1117;
  --sec: #161b23;
  --pri: #4493F8;
  --border: #3d444db3;
  --text: #f0f6fc;
  --muted: #f0f6fcb0;
  --onpri: #0e1117;
  --initials: #4493F8;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --dw: 520px;
}
:root[data-mock="tavern"] {
  --page: #0a0300;
  --bg: #140701;
  --sec: #3D271C;
  --pri: #C05E5E;
  --border: #956F01;
  --text: #CBAB96;
  --muted: #CBAB96b0;
  --onpri: #140701;
  --initials: #CBAB96;
}
:root[data-width="400"] { --dw: 400px; }

* { box-sizing: border-box; margin: 0; }
body {
  background: var(--page);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 24px;
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

.wrap { max-width: 1320px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }

/* ---------- Seitenkopf ---------- */
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; }
.head h1 { font-size: 32px; line-height: 40px; font-weight: 600; text-wrap: balance; }
.head p { color: var(--muted); font-size: 14px; line-height: 20px; max-width: 62ch; margin-top: 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.ctl { display: flex; flex-direction: column; gap: 4px; }
.ctl > span { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--sec); border-radius: 12px; flex-wrap: wrap; }
.tabs button { height: 32px; padding: 0 12px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; }
.tabs button:hover { background: var(--bg); }
.tabs button[aria-pressed="true"], .tabs button[aria-selected="true"] { background: var(--pri); color: var(--onpri); }

/* ---------- Admin-Rahmen ---------- */
.frame { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg); }
.tb { height: 56px; display: grid; grid-template-columns: 240px minmax(0, 1fr) 240px; align-items: center; padding-inline: 24px; border-bottom: 1px solid var(--sec); }
.tb .adv { justify-self: center; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.tb .adv::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--text); border-bottom: 2px solid var(--text); transform: rotate(45deg) translateY(-3px); }
.tb .icons { justify-self: end; display: flex; gap: 4px; }
.tb .icons i { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; }
.tb .icons i.on { background: var(--pri); }
.tb .icons i::before { content: ""; width: 18px; height: 14px; border: 2px solid var(--text); border-radius: 3px; }
.tb .icons i.on::before { border-color: var(--onpri); }
.tb .brand { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--muted); }
.body { display: grid; grid-template-columns: 64px minmax(0, 1fr); }
.rail { border-right: 1px solid var(--sec); padding: 24px 12px; display: flex; flex-direction: column; gap: 8px; }
.rail i { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; }
.rail i::before { content: ""; width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--muted); }
.rail i.on { background: var(--sec); }
.content { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--dw); gap: 24px; padding-inline: 24px; min-height: 1000px; }
.notes { padding-block: 24px; min-width: 0; }
.page { border: 1px solid var(--border); border-radius: 12px; padding: 48px 32px; display: flex; flex-direction: column; gap: 12px; }
.page .bar { height: 12px; border-radius: 999px; background: var(--sec); }
.page .bar.h1 { height: 24px; width: 55%; margin-bottom: 12px; }
.page .bar.h2 { height: 16px; width: 35%; margin-top: 20px; }
.dashcol { padding-block: 24px; min-width: 0; }
.fold { position: absolute; left: 0; right: 0; top: 944px; border-top: 2px dashed var(--pri); pointer-events: none; }
.fold span { position: absolute; right: 24px; top: -26px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--pri); background: var(--bg); padding: 2px 8px; border-radius: 4px; }

/* ---------- Erläuterung ---------- */
.explain { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; }
.explain h2 { font-size: 24px; line-height: 32px; font-weight: 600; }
.explain .tag { color: var(--muted); font-size: 14px; line-height: 20px; margin-top: 4px; }
.explain ul { margin-top: 16px; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 20px; }
.facts { background: var(--sec); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-self: start; }
.fact { display: flex; flex-direction: column; gap: 4px; }
.fact b { font-size: 20px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fact p { font-size: 14px; line-height: 20px; color: var(--muted); }

/* ---------- Gemeinsame Bausteine im Mockup ---------- */
.lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.sm { font-size: 14px; line-height: 20px; }
.md { font-size: 14px; line-height: 20px; font-weight: 500; }
.semi { font-weight: 600; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.p { background: var(--sec); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ib { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--bg); color: var(--text); }
.ib svg { width: 20px; height: 20px; fill: currentColor; }
.ib.on { background: var(--pri); color: var(--onpri); }
.ib.ghost { background: transparent; }
.ib.ghost:hover { background: var(--bg); }
.ib:disabled { color: var(--muted); cursor: default; }
.ib.flash { background: var(--pri); color: var(--onpri); }
.ib.txt { font-size: 20px; line-height: 28px; font-weight: 600; }
.tbtn { height: 40px; padding: 0 16px; border-radius: 8px; background: var(--bg); font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; }
.tbtn.on { background: var(--pri); color: var(--onpri); }
.dot { width: 8px; height: 8px; flex: none; border-radius: 999px; background: var(--pri); }
.status { display: inline-flex; align-items: center; gap: 8px; }
.wall-img, .ground-img { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; overflow: hidden; }
.wall-img {
  background:
    radial-gradient(circle at 28% 62%, rgba(255, 170, 80, .55), transparent 30%),
    radial-gradient(circle at 72% 38%, rgba(255, 205, 130, .32), transparent 22%),
    linear-gradient(180deg, #24150c 0%, #5b3519 48%, #170d07 100%);
}
.wall-img::after { content: ""; position: absolute; inset: auto 8% 18% 8%; height: 14%; background: rgba(20, 10, 4, .75); border-radius: 4px; }
.ground-img {
  background:
    radial-gradient(ellipse at 50% 55%, rgba(0, 0, 0, .0) 0 22%, rgba(0, 0, 0, .55) 23% 25%, transparent 26%),
    radial-gradient(ellipse at 50% 55%, #6b4528 0 22%, transparent 23%),
    repeating-linear-gradient(90deg, #4a3020 0 18px, #3a2517 18px 20px);
}
.chip-on-img { position: absolute; left: 8px; top: 8px; z-index: 1; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #f0f6fc; background: rgba(0, 0, 0, .6); padding: 2px 6px; border-radius: 4px; }

.seg { display: flex; gap: 4px; padding: 4px; background: var(--bg); border-radius: 12px; min-width: 0; }
.seg button { flex: 1 1 0; min-width: 0; height: 32px; padding: 0 8px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button:hover { background: var(--sec); }
.seg button.on { background: var(--pri); color: var(--onpri); }

.opts { display: flex; flex-wrap: wrap; gap: 4px; }
.opts button { height: 40px; padding: 0 16px; border-radius: 8px; background: var(--bg); font-size: 14px; line-height: 20px; font-weight: 600; }
.opts button.on { background: var(--pri); color: var(--onpri); }

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; --v: 50%; min-width: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: linear-gradient(to right, var(--pri) var(--v), var(--bg) var(--v)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 999px; background: var(--text); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 999px; background: var(--bg); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--pri); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 999px; background: var(--text); }

.sounds { display: flex; flex-wrap: wrap; row-gap: 8px; column-gap: 16px; }
.sgroup { display: flex; flex-wrap: wrap; gap: 4px; }
.avatar { flex: none; display: grid; place-items: center; background: var(--sec); color: var(--initials); border: 1px solid var(--border); border-radius: 8px; font-weight: 600; }

/* ---------- Heute ---------- */
.v0 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(144px, auto); gap: 16px; }
.v0 .prev { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.v0 figure { display: flex; flex-direction: column; gap: 4px; }
.v0 .scene-name { font-size: 20px; line-height: 28px; font-weight: 600; margin-top: 12px; display: block; }
.v0 .music { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto; grid-template-areas: "toggle volume" "track volume" "output output"; gap: 12px; height: 100%; }
.vslider { grid-area: volume; position: relative; width: 16px; min-height: 96px; }
.vslider::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 4px; border-radius: 999px; background: linear-gradient(to top, var(--pri) 60%, var(--bg) 60%); }
.vslider::after { content: ""; position: absolute; left: 0; bottom: calc(8px + 60% - 16px); width: 16px; height: 16px; border-radius: 999px; background: var(--text); }
.v0 .screens { display: flex; flex-direction: column; gap: 12px; }
.v0 .srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.v0 .cell { display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; column-gap: 12px; align-items: center; margin-top: 12px; }
.v0 .cell input { grid-column: 1 / -1; }
.hero { display: flex; align-items: center; gap: 24px; padding: 24px; background: var(--bg); border-radius: 12px; min-width: 0; }
.hero .av { position: relative; flex: none; }
.hero .avatar { width: 96px; height: 128px; border-radius: 12px; font-size: 32px; line-height: 40px; font-weight: 500; }
.hero .badge { position: absolute; top: -8px; left: -8px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 999px; background: var(--pri); color: var(--onpri); border: 2px solid var(--bg); font-size: 14px; font-weight: 500; }
.hero .cn { font-size: 32px; line-height: 40px; font-weight: 500; overflow-wrap: break-word; hyphens: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 4px; }
.chips span { padding: 0 8px; font-size: 14px; line-height: 20px; background: var(--sec); border: 1px solid var(--border); border-radius: 8px; }

/* ---------- A: Bühne ---------- */
.va { display: flex; flex-direction: column; gap: 16px; }
.stage { position: relative; border-radius: 12px; overflow: hidden; }
.stage > .wall-img { border-radius: 0; }
.stage .inset { position: absolute; top: 12px; right: 12px; width: 32%; border-radius: 8px; box-shadow: 0 0 0 2px rgba(0, 0, 0, .55); }
.stage .cap { position: absolute; inset: auto 0 0 0; padding: 48px 24px 20px; background: linear-gradient(transparent, rgba(0, 0, 0, .85)); display: flex; flex-direction: column; gap: 4px; }
.stage .cap strong { font-size: 24px; line-height: 32px; font-weight: 600; color: #f0f6fc; text-wrap: balance; }
.stage .cap p { font-size: 14px; line-height: 20px; color: rgba(240, 246, 252, .82); max-width: 52ch; }
.stage .cap .lbl { color: rgba(240, 246, 252, .82); }
.va .audio { gap: 16px; }
.np { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.np .t { display: flex; flex-direction: column; min-width: 0; }
.vol { display: grid; grid-template-columns: 20px minmax(0, 1fr) 3ch; gap: 12px; align-items: center; }
.vol svg { width: 20px; height: 20px; fill: var(--muted); }
.vol output { text-align: right; }
.hr { height: 1px; background: var(--border); }
.va .sgroup { gap: 0; background: var(--bg); border-radius: 8px; }
.va .sgroup .ib { background: transparent; }
.va .sgroup .ib:hover { background: var(--pri); color: var(--onpri); }
.va .sounds { column-gap: 8px; }
.table-rows { display: flex; flex-direction: column; }
.trow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 40px; gap: 8px 12px; align-items: center; padding-block: 12px; border-top: 1px solid var(--border); }
.trow:first-child { border-top: 0; padding-top: 0; }
.trow:last-child { padding-bottom: 0; }
.trow .who { display: flex; flex-direction: column; min-width: 0; }
.trow .sub { grid-column: 1; }
.trow .subctl { grid-column: 2; display: grid; grid-template-columns: minmax(0, 1fr) 3ch; gap: 12px; align-items: center; }
.party-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper .val { min-width: 2.2ch; text-align: center; font-size: 20px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper .lbl { margin-right: 8px; color: var(--muted); }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 8px; background: var(--bg); border-radius: 12px; min-width: 0; }
.prow .avatar { width: 40px; height: 40px; font-size: 14px; line-height: 20px; }
.prow .t { min-width: 0; display: flex; flex-direction: column; }
.prow .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- B: Bento ---------- */
.vb { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; grid-auto-flow: dense; }
.vb .p { padding: 16px; }
.s6 { grid-column: span 6; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; } .s2 { grid-column: span 2; }
.vb .scene { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
.vb .scene .side { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.vb .scene strong { font-size: 20px; line-height: 28px; font-weight: 600; overflow-wrap: break-word; hyphens: auto; }
.vb .scene .ground-img { margin-top: auto; }
.vb .music.playing { box-shadow: inset 0 0 0 2px var(--pri); }
.vb .music .top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.vb .level { align-items: center; justify-content: space-between; text-align: center; }
.vb .level .big { font-size: 32px; line-height: 40px; font-weight: 600; font-variant-numeric: tabular-nums; }
.vb .level .row { display: flex; gap: 4px; }
.vb .lrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.vb .scr { gap: 4px; }
.vb .scr .ib { margin-top: 8px; }
.vb .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; }
.pcard { display: flex; gap: 12px; padding: 12px; background: var(--bg); border-radius: 12px; min-width: 0; align-items: center; }
.pcard .avatar { width: 48px; height: 64px; font-size: 20px; line-height: 28px; font-weight: 500; }
.pcard .t { display: flex; flex-direction: column; min-width: 0; }
.pcard .cn { font-size: 16px; line-height: 24px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .lbl { color: var(--muted); }
.pcard .chips span { font-size: 12px; line-height: 16px; padding: 0 6px; }

/* ---------- C: Cockpit ---------- */
.vc { display: flex; flex-direction: column; gap: 12px; }
.strip { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--sec); border-radius: 12px; }
.chip { height: 40px; padding: 0 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.chip:hover, .chip[aria-expanded="true"] { background: var(--bg); }
.chip .k { color: var(--muted); }
.chip b { font-weight: 600; }
.chip.lvl { margin-left: auto; padding-right: 4px; cursor: default; }
.chip.lvl:hover { background: none; }
.chip.lvl .ib { width: 32px; height: 32px; }
.drawer { background: var(--sec); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.drawer .drow { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.surface { background: var(--sec); border-radius: 12px; padding-inline: 24px; }
.section { padding-block: 24px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--border); }
.section:first-child { border-top: 0; }
.shead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.vc .imgs { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.vc .scene-name { font-size: 20px; line-height: 28px; font-weight: 600; }
.vc .sounds { column-gap: 12px; }
.vc .sgroup { gap: 0; }
.plain { display: flex; flex-direction: column; }
.lrow2 { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 6px; }
.lrow2 .avatar { width: 32px; height: 32px; font-size: 12px; line-height: 16px; background: var(--bg); }
.lrow2 .t { display: flex; flex-direction: column; min-width: 0; }
.lrow2 .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- schmal ---------- */
@media (max-width: 960px) {
  .rail, .notes, .tb .brand { display: none; }
  .body { grid-template-columns: minmax(0, 1fr); }
  .content { grid-template-columns: minmax(0, min(var(--dw), 100%)); justify-content: center; padding-inline: 16px; }
  .tb { grid-template-columns: minmax(0, 1fr) auto; padding-inline: 16px; }
  .tb .adv { justify-self: start; }
  .explain { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .vb .scene { grid-template-columns: minmax(0, 1fr); }
  .trow, .drawer .drow { grid-template-columns: 72px minmax(0, 1fr) 40px; }
}
@media (prefers-reduced-motion: no-preference) {
  .ib, .seg button, .chip, .tabs button { transition: background-color .12s ease; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 20 20"><path d="M5 4h3.5v12H5zM11.5 4H15v12h-3.5z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 20 20"><path d="M10 17s-6.5-4-6.5-8.6C3.5 6 5.3 4.5 7.3 4.5c1.2 0 2.1.6 2.7 1.5.6-.9 1.5-1.5 2.7-1.5 2 0 3.8 1.5 3.8 3.9C16.5 13 10 17 10 17z"/></symbol>
  <symbol id="i-bottle" viewBox="0 0 20 20"><path d="M8 2h4v3.2l2.5 3.3V17a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V8.5L8 5.2z"/></symbol>
  <symbol id="i-buff" viewBox="0 0 20 20"><path d="M10 2.5l6.5 7.5H12v7.5H8V10H3.5z"/></symbol>
  <symbol id="i-music" viewBox="0 0 20 20"><path d="M7.5 4.5L17 2.5v11a2.5 2.5 0 1 1-2-2.45V5.4l-5.5 1.2v8.9a2.5 2.5 0 1 1-2-2.45z"/></symbol>

const FOLD = 944;
const dash = document.getElementById('dash');
const explain = document.getElementById('explain');
let current = 'a';

function syncRanges(root) {
  root.querySelectorAll('input[type="range"]').forEach((r) => {
    const pct = ((r.value - r.min) / (r.max - r.min)) * 100;
    r.style.setProperty('--v', pct + '%');
  });
}

function measure() {
  const h = Math.round(dash.offsetHeight + 24);
  const el = document.getElementById('height');
  if (!el) return;
  const over = h - FOLD;
  el.textContent = h + ' px';
  document.getElementById('heightNote').textContent = over > 0
    ? `Scrollt bei 1080p um ${over} px.`
    : `Passt bei 1080p ohne Scrollen, ${-over} px Luft.`;
}

function render() {
  const v = VARIANTS[current];
  dash.innerHTML = v.render();
  syncRanges(dash);
  explain.innerHTML = `<div><h2>${v.name}</h2><p class="tag">${v.tag}</p><ul>${v.bullets.map((b) => `<li>${b}</li>`).join('')}</ul></div>
    <aside class="facts"><div class="fact"><span class="lbl muted">Höhe des Dashboards</span><b id="height">–</b><p id="heightNote"></p></div>
    <div class="fact"><span class="lbl muted">Aufwand</span><p>${v.effort}</p></div></aside>`;
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === current)));
  requestAnimationFrame(measure);
}

function select(v) {
  if (!VARIANTS[v]) return;
  current = v;
  try { history.replaceState(null, '', '#' + v); } catch (e) { /* Hash ist nur Komfort */ }
  render();
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (b) select(b.dataset.v);
});
document.getElementById('themes').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.documentElement.dataset.mock = b.dataset.t;
  document.querySelectorAll('#themes button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
});
document.getElementById('widths').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.documentElement.dataset.width = b.dataset.w;
  document.querySelectorAll('#widths button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  requestAnimationFrame(measure);
});

dash.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.closest('.seg')) {
    t.parentElement.querySelectorAll('button').forEach((x) => { x.classList.toggle('on', x === t); x.setAttribute('aria-pressed', String(x === t)); });
  } else if (t.hasAttribute('data-opt')) {
    t.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === t));
  } else if (t.hasAttribute('data-play')) {
    state.playing = !state.playing; render();
  } else if (t.hasAttribute('data-out')) {
    state.out = true; render();
  } else if (t.dataset.lvl) {
    state.level = Math.min(20, Math.max(1, state.level + Number(t.dataset.lvl)));
    dash.querySelectorAll('[data-level]').forEach((x) => { x.textContent = state.level; });
  } else if (t.hasAttribute('data-sound')) {
    t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 220);
  } else if (t.dataset.drawer) {
    const open = t.getAttribute('aria-expanded') !== 'true';
    dash.querySelectorAll('[data-drawer]').forEach((c) => c.setAttribute('aria-expanded', String(open && c.dataset.drawer === t.dataset.drawer)));
    dash.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = !(open && p.dataset.panel === t.dataset.drawer); });
    requestAnimationFrame(measure);
  }
});
dash.addEventListener('input', (e) => {
  const r = e.target;
  if (r.type !== 'range') return;
  syncRanges(r.parentElement);
  const out = r.parentElement.querySelector('output');
  if (out) out.textContent = r.value;
});

if (typeof ResizeObserver !== 'undefined') new ResizeObserver(measure).observe(dash);
const fromHash = (location.hash || '').slice(1);
select(VARIANTS[fromHash] ? fromHash : 'a');
</script>
</body>
</html>
