<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Mockup Kampf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Initiative auf dem Wall Screen während eines Kampfes (Kachel-Stil aus player-card-tile.html, Kacheln wie im Admin).
   - Leiste oben über die volle Breite, Kacheln oben bündig; erscheint automatisch, solange ein Kampf läuft; keine Bedienelemente.
   - Warteschlange: links groß der Teilnehmer am Zug („Am Zug“, „Runde N“), rechts davon die Folgenden in
     Initiative-Reihenfolge. Nach jedem „Zug beenden“ im Admin rückt sie nach: der Aktive geht ans Ende, alle rücken
     auf, der Nächste wird groß (etwa 0,5 s; bei „Bewegung reduzieren“ ohne Animation).
   - Rundentrenner „Runde N+1“ zwischen dem Letzten dieser Runde und dem Ersten der nächsten; er wandert mit nach
     links, erreicht er die große Kachel, beginnt die neue Runde.
   - Spieler: Avatar (Initialen), Vorname (groß: voller Name), Volk · Klasse. NPCs: Nummer im Avatar in der Farbe
     ihrer Art (negative/positive), „Gegner 3“ bzw. „Verbündeter 4“, nie die Bezeichnung aus dem Admin.
   - Besiegte NPCs verschwinden aus der Leiste; tote Spieler bleiben ausgegraut mit Totenkopf und „Tot“.
   - Passen nicht alle Kacheln in die Breite, fasst „+N weitere“ den Rest zusammen.
   - Weltkarte (Wall-Overlay) liegt als Overlay über der Leiste (meist nur kurz eingeblendet), deckend.
   Avatar-Fläche der Spieler: background, weil der Avatar direkt auf der Kachel liegt (wie DND-43, Runde 2).
   Zustände über die Mockup-Leiste unten links. */
:root {
  color-scheme: dark;
  --bg: #0e1117;
  --sec: #161b23;
  --sec-t: color-mix(in srgb, #161b23 75%, transparent);
  --pri: #4493F8;
  --border: #3d444db3;
  --text: #f0f6fc;
  --muted: #f0f6fcb0;
  --onpri: #0e1117;
  --initials: #4493F8;
  --scrim: rgba(0, 0, 0, 0.750);
  --onscrim: #ffffff;
  --negative: #ff6b6b;
  --negative-surface: #290000;
  --negative-border: #ff2424;
  --positive: #3fd033;
  --positive-surface: #072900;
  --positive-border: #099000;
}
:root[data-theme="tavern"] {
  --bg: #140701;
  --sec: #3D271C;
  --sec-t: color-mix(in srgb, #3D271C 92%, transparent);
  --pri: #C05E5E;
  --border: #956F01;
  --text: #CBAB96;
  --muted: #CBAB96b0;
  --onpri: #140701;
  --initials: #CBAB96;
}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: url("../../../../media/images/wall_screen/fight.jpg") center / cover no-repeat, var(--bg);
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 24px;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }

.lbl { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.muted { color: var(--muted); }
.tile {
  background: var(--sec-t);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 var(--border);
  border-radius: 12px;
}

/* ---------- Weltkarte (Wall-Overlay): deckend über der Leiste ---------- */
.map {
  position: fixed; top: 48px; left: 50%; z-index: 2; transform: translateX(-50%); background: var(--sec);
  width: min(calc(100vw - 128px), 1100px);
  height: calc(100vh - 96px);
  padding: 24px; display: none;
}
.map.on { display: block; }
.map img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }

/* ---------- Initiative-Leiste ---------- */
.strip {
  position: fixed; left: 48px; right: 48px; top: 32px;
  display: flex; align-items: flex-start; gap: 16px;
}
.ct {
  flex: none; display: flex; flex-direction: column; align-items: center; text-align: center;
  width: 168px; height: 176px; padding: 12px; gap: 8px;
}
.cav {
  position: relative; flex: none; display: grid; place-items: center;
  width: 72px; height: 96px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--initials);
  font-size: 24px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.k-enemy .cav { background: var(--negative-surface); border-color: var(--negative-border); color: var(--negative); }
.k-ally .cav { background: var(--positive-surface); border-color: var(--positive-border); color: var(--positive); }
.ct .t { display: flex; flex-direction: column; min-width: 0; max-width: 100%; }
.ct .t span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cname { font-size: 16px; line-height: 24px; font-weight: 600; }
.cmeta { font-size: 14px; line-height: 20px; color: var(--muted); }

/* am Zug: größer, Rahmen in der Hauptfarbe */
.ct.active { width: 240px; height: auto; padding: 16px; gap: 12px; box-shadow: inset 0 0 0 2px var(--pri); }
.ct.active .cav { width: 120px; height: 160px; border-radius: 12px; font-size: 48px; line-height: 56px; }
.ct.active .cname { font-size: 24px; line-height: 32px; }
.ct.active .cmeta { font-size: 16px; line-height: 24px; }
.ctop { align-self: stretch; display: flex; justify-content: space-between; gap: 8px; }
.ctop .now { color: var(--pri); }

/* tot: ausgegraut, Totenkopf auf dem Avatar */
.ct.dead .cav, .ct.dead .t { opacity: .45; }
.skull { position: absolute; right: -8px; bottom: -8px; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: var(--negative-surface); color: var(--negative); border: 2px solid var(--sec); }
.skull svg { width: 16px; height: 16px; }

/* Rundentrenner und Rest */
.sep, .more { flex: none; height: 176px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.sep { width: 72px; }
.sep strong, .more strong { font-size: 32px; line-height: 40px; font-weight: 600; font-variant-numeric: tabular-nums; }
.more { width: 96px; }

/* ---------- nur im Mockup ---------- */
.mock { position: fixed; bottom: 12px; left: 12px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; max-width: calc(100vw - 24px); padding: 6px 6px 6px 14px; border-radius: 12px; background: var(--scrim); color: var(--onscrim); }
.mock button { height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; line-height: 18px; font-weight: 600; }
.mock button:hover { background: rgba(255, 255, 255, .12); }
.mock button[aria-pressed="true"] { background: rgba(255, 255, 255, .22); }
.ghost { position: fixed; margin: 0; pointer-events: none; z-index: 1; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-skull" viewBox="0 0 20 20"><path fill="currentColor" fill-rule="evenodd" d="M10 2a7 7 0 0 0-7 7c0 2.4 1.2 4.4 3 5.6V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.4c1.8-1.2 3-3.2 3-5.6a7 7 0 0 0-7-7zM7 8.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></symbol>
</svg>

<div class="tile map" id="map" aria-label="Weltkarte"><img src="../../../public/assets/images/ground_screen/mapOverview.jpg" alt="Weltkarte"></div>

<section class="strip" id="strip" aria-label="Initiative"></section>

<div class="mock" role="group" aria-label="Mockup-Steuerung (nur im Mockup)">
  <span class="lbl">Mockup</span>
  <button type="button" data-act="turn">Zug beenden</button>
  <button type="button" data-act="toggle" data-id="g3" aria-pressed="false">Gegner 3 besiegt</button>
  <button type="button" data-act="toggle" data-id="thalia" aria-pressed="false">Thalia tot</button>
  <button type="button" data-act="add">+ Verstärkung</button>
  <button type="button" data-act="map" aria-pressed="false">Weltkarte</button>
  <button type="button" data-act="theme">Theme</button>
  <button type="button" data-act="reset">Zurücksetzen</button>
</div>

<script>
const PLAYERS = {
  thalia: { c: 'Thalia Sturmwind', race: 'Elfe', cls: 'Magierin' },
  brom: { c: 'Brom Eisenfaust', race: 'Zwerg', cls: 'Kämpfer' },
  kael: { c: 'Kael Schattenschritt', race: 'Halbling', cls: 'Schurke' },
  sera: { c: 'Seraphine Morgenlicht', race: 'Mensch', cls: 'Klerikerin' },
};
const KIND = { enemy: 'Gegner', ally: 'Verbündeter' };
const W = { active: 240, tile: 168, sep: 72, more: 96, gap: 16 };

const player = (pid) => ({ id: pid, kind: 'player', pid, defeated: false });
const npc = (id, kind, number) => ({ id, kind, number, defeated: false });
function initialState() {
  return {
    list: [player('kael'), npc('g1', 'enemy', 1), player('thalia'), npc('g3', 'enemy', 3), player('brom'),
      npc('v4', 'ally', 4), npc('g2', 'enemy', 2), player('sera')],
    activeId: 'thalia',
    round: 3,
    map: false,
  };
}
let s = initialState();
s.list.find((c) => c.id === 'g2').defeated = true;

const $ = (id) => document.getElementById(id);
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const initials = (n) => n.split(' ').slice(0, 2).map((w) => w[0]).join('');

// auf der Wall: besiegte NPCs fallen weg, tote Spieler bleiben; wer am Zug ist, bleibt immer sichtbar
const shown = (c) => c.kind === 'player' || !c.defeated || c.id === s.activeId;

// Warteschlange ab dem Aktiven; der Trenner steht dort, wo die Initiative-Reihenfolge von vorn beginnt
function queue() {
  const alive = s.list.filter(shown);
  const i = Math.max(0, alive.findIndex((c) => c.id === s.activeId));
  const rotated = alive.slice(i).concat(alive.slice(0, i));
  const items = rotated.map((c) => ({ key: c.id, type: 'c', c }));
  items.splice(alive.length - i, 0, { key: 'sep', type: 'sep' });
  return items;
}

// so viele Kacheln, wie in die Breite passen; der Rest wird zu „+N weitere“
function visible(items) {
  const width = $('strip').clientWidth;
  const widthOf = (it, idx) => (it.type === 'sep' ? W.sep : idx === 0 ? W.active : W.tile);
  let used = 0;
  const out = [];
  for (let idx = 0; idx < items.length; idx += 1) {
    const rest = items.slice(idx + 1).some((it) => it.type === 'c');
    const need = used + (out.length ? W.gap : 0) + widthOf(items[idx], idx);
    const reserve = rest ? W.gap + W.more : 0;
    if (need + reserve > width) {
      const hidden = items.slice(idx).filter((it) => it.type === 'c').length;
      if (hidden) out.push({ key: 'more', type: 'more', n: hidden });
      return out;
    }
    used = need;
    out.push(items[idx]);
  }
  return out;
}

function tileHtml(c, active) {
  const p = c.kind === 'player' ? PLAYERS[c.pid] : null;
  const dead = p && c.defeated;
  const name = p ? (active ? p.c : p.c.split(' ')[0]) : `${KIND[c.kind]} ${c.number}`;
  const meta = dead ? 'Tot' : p ? `${p.race} · ${p.cls}` : '';
  return `${active ? `<div class="ctop"><span class="lbl now">Am Zug</span><span class="lbl muted">Runde ${s.round}</span></div>` : ''}
    <div class="cav">${p ? initials(p.c) : c.number}${dead ? '<span class="skull" aria-label="Tot"><svg><use href="#i-skull"/></svg></span>' : ''}</div>
    <div class="t"><span class="cname">${name}</span><span class="cmeta">${meta || '&nbsp;'}</span></div>`;
}

const nodes = new Map();
function node(key, tag = 'div') {
  if (!nodes.has(key)) {
    const el = document.createElement(tag);
    el.dataset.key = key;
    nodes.set(key, el);
  }
  return nodes.get(key);
}

function render(animate) {
  const strip = $('strip');
  const before = new Map();
  [...strip.children].forEach((el, idx) => before.set(el.dataset.key, {
    idx, rect: el.getBoundingClientRect(), clone: el.cloneNode(true),
  }));

  const items = visible(queue());
  const els = items.map((it, idx) => {
    const el = node(it.key);
    if (it.type === 'c') {
      el.className = `tile ct k-${it.c.kind}${idx === 0 ? ' active' : ''}${it.c.kind === 'player' && it.c.defeated ? ' dead' : ''}`;
      el.innerHTML = tileHtml(it.c, idx === 0);
      el.setAttribute('aria-current', idx === 0 ? 'step' : 'false');
    } else if (it.type === 'sep') {
      el.className = 'tile sep';
      el.innerHTML = `<span class="lbl muted">Runde</span><strong>${s.round + 1}</strong>`;
    } else {
      el.className = 'tile more';
      el.innerHTML = `<strong>+${it.n}</strong><span class="lbl muted">weitere</span>`;
    }
    return el;
  });
  strip.replaceChildren(...els);
  $('map').classList.toggle('on', s.map);

  if (!animate || reduced()) return;
  const ease = 'cubic-bezier(.2, .7, .2, 1)';
  const ghost = (b, to) => {
    const g = b.clone;
    g.classList.add('ghost');
    Object.assign(g.style, { left: `${b.rect.left}px`, top: `${b.rect.top}px`, width: `${b.rect.width}px`, height: `${b.rect.height}px` });
    document.body.append(g);
    g.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: to }], { duration: 300, easing: ease })
      .finished.then(() => g.remove());
  };
  const keys = new Set(items.map((it) => it.key));
  before.forEach((b, key) => { if (!keys.has(key)) ghost(b, 'translateY(-24px)'); });
  els.forEach((el, idx) => {
    const b = before.get(el.dataset.key);
    if (!b || idx > b.idx) {
      // neu oder ans Ende gerückt: verblasst an der alten Stelle, kommt rechts herein
      if (b) ghost(b, 'translateX(-48px)');
      el.animate([{ opacity: 0, transform: 'translateX(48px)' }, { opacity: 1, transform: 'none' }],
        { duration: 500, delay: 100, easing: ease, fill: 'backwards' });
      return;
    }
    const r = el.getBoundingClientRect();
    const t = `translate(${b.rect.left - r.left}px, ${b.rect.top - r.top}px) scale(${b.rect.width / r.width}, ${b.rect.height / r.height})`;
    if (t === 'translate(0px, 0px) scale(1, 1)') return;
    el.animate([{ transformOrigin: 'left top', transform: t }, { transformOrigin: 'left top', transform: 'none' }],
      { duration: 500, easing: ease });
  });
}

/* ---------- was der Admin auslöst ---------- */
function endTurn() {
  const from = s.list.findIndex((c) => c.id === s.activeId);
  for (let i = 1; i <= s.list.length; i += 1) {
    const c = s.list[(from + i) % s.list.length];
    if (!c.defeated) {
      if (from + i >= s.list.length) s.round += 1;
      s.activeId = c.id;
      return;
    }
  }
}
let nextNpc = 5;
const ACTIONS = {
  turn: endTurn,
  toggle: (id) => { const c = s.list.find((x) => x.id === id); c.defeated = !c.defeated; },
  add: () => { s.list.push(npc(`g${nextNpc}`, 'enemy', nextNpc)); nextNpc += 1; },
  map: () => { s.map = !s.map; },
  theme: () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'tavern' ? 'dark' : 'tavern';
  },
  reset: () => { s = initialState(); s.list.find((c) => c.id === 'g2').defeated = true; nextNpc = 5; },
};
document.querySelector('.mock').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  ACTIONS[b.dataset.act](b.dataset.id);
  document.querySelectorAll('.mock [data-act="toggle"]').forEach((t) => {
    t.setAttribute('aria-pressed', String(s.list.find((c) => c.id === t.dataset.id).defeated));
  });
  document.querySelector('.mock [data-act="map"]').setAttribute('aria-pressed', String(s.map));
  render(['turn', 'toggle', 'add'].includes(b.dataset.act));
});
window.addEventListener('resize', () => render(false));

render(false);
</script>
</body>
</html>
