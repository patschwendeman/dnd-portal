<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Spieler-Karte Kachel</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: Inter, -apple-system, "Segoe UI", sans-serif; background: #2a2d33; color: #e6e6e6; padding: 32px; }
main { display: grid; gap: 24px; max-width: 760px; }
.cap { font-size: 12px; color: #b0b4ba; margin-bottom: 8px; }
.grid { background: #0e1117; border-radius: 12px; padding: 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tile { background: #161b23; border-radius: 12px; padding: 16px; display: grid; justify-items: center; gap: 8px; text-align: center; }
.avatar { width: 72px; height: 96px; border-radius: 8px; background: #0e1117; color: #4493F8; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 500; }
.name { color: #f0f6fc; font-size: 16px; font-weight: 500; }
.meta { color: #f0f6fcb0; font-size: 12px; }
</style>
</head>
<body>
<main>
<section>
  <p class="cap">Kachel (vertikal, z. B. Gruppenübersicht auf der Wall) · Dark</p>
  <div class="grid">
    <div class="tile"><div class="avatar">TE</div><span class="name">Thorin</span><span class="meta">Zwerg · Kämpfer</span></div>
    <div class="tile"><div class="avatar">EM</div><span class="name">Elaria</span><span class="meta">Halbelfe · Zauberin</span></div>
    <div class="tile"><div class="avatar">BS</div><span class="name">Brom</span><span class="meta">Mensch · Kleriker</span></div>
  </div>
</section>
</main>
</body>
</html>
