server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    # Files directly in /assets/ are Vite output with a content hash in the name and never change.
    # Media from public/ lives in subfolders (/assets/images/ …) and keeps the default caching.
    location ~ ^/assets/[^/]+$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Markdown notes (/story/…): the default mime.types has no entry for .md, so without this they would be
    # served as application/octet-stream and gzip would not apply.
    location ~* \.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new build is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API behind the same origin, so other devices in the LAN only need this address. The prefix is removed
    # (/api/adventures → /adventures); Range requests for media pass through.
    location ^~ /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $http_host;
    }

    # WebSocket of the game table. The API checks that Origin and Host match, hence the original Host header.
    # The server pings every 15 s, the read timeout only has to be well above that.
    location = /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }

    # SPA fallback: client-side routes (/admin, /wall, /ground) are served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
