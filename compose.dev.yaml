# Lokale Entwicklung: DB, API und Frontend mit Hot-Reload aus dem Root starten.
#   ./dnd.sh dev [--tools]                                        # empfohlen (stoppt vorher den Prod-Stack)
#   docker compose -f compose.dev.yaml up --build                 # db :5432, app :8000, react-app :5173
#   docker compose -f compose.dev.yaml --profile tools up         # zusätzlich pgAdmin :5050
# Die Services sind in den Teil-Dateien definiert und lassen sich dort weiterhin einzeln starten.
# Eigener Projektname → eigenes DB-Volume (dnd-portal-dev_postgres_data); der Seeder füllt es beim ersten Start.
name: dnd-portal-dev

include:
  - path: backend/docker-compose.yml
    env_file: backend/.env
  - path: frontend/docker-compose.yml
