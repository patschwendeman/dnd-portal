# Production stack for the game table: DB, API and frontend (static build served by nginx).
#   dnd prod                                                    # recommended (or ./script.sh prod), see script.sh
#   docker compose -f compose.prod.yaml up -d --build --wait    # ui :8080, api :8000, db :5432
#   docker compose -f compose.prod.yaml down                    # stop (-v: reset DB)
# Do not run together with the dev stack (compose.dev.yaml): API and DB use the same ports.
# Own project name → own DB volume; on start the API runs the migrations, the seeder fills empty tables.
# The frontend reaches the API through nginx (/api/, /ws), so other devices only need http://<IP>:8080.
# Different API URL for the frontend: VITE_API_URL=... docker compose -f compose.prod.yaml up -d --build --wait
name: dnd-portal-prod

services:
  db:
    image: postgres:17
    container_name: dnd-prod-db
    restart: unless-stopped
    # POSTGRES_DB/USER/PASSWORD from backend/.env
    env_file: backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  api:
    build:
      context: backend
    container_name: dnd-prod-api
    restart: unless-stopped
    working_dir: /app
    env_file: backend/.env
    # URL of the Player Screen for the QR code in the Admin; set by script.sh, empty = unknown.
    environment:
      PLAYER_URL: ${PLAYER_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Scene media, served under /media; read-only (no upload yet).
    volumes:
      - ./media:/app/media:ro
    # Checked with Python because python:3.11-slim has no curl. ui and `up --wait` wait for it so that
    # Admin/Wall/Ground do not load before the API is ready.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/adventures', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  ui:
    build:
      context: frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/}
    container_name: dnd-prod-ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
