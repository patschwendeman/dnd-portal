# Production stack for the game table: DB, API and frontend (static build served by nginx).
#   dnd prod                                                    # recommended (or ./script.sh prod), see script.sh
#   docker compose -f compose.prod.yaml up -d --build --wait    # web :8080, app :8000, db :5432
#   docker compose -f compose.prod.yaml down                    # stop (-v: reset DB)
# Do not run together with the dev stack (compose.dev.yaml): API and DB use the same ports.
# Own project name → own DB volume; the seeder fills the DB on first start.
# Different API URL for the frontend: VITE_API_URL=... docker compose -f compose.prod.yaml up -d --build --wait
name: dnd-portal-prod

services:
  db:
    image: postgres:17
    container_name: dnd-prod-db
    restart: unless-stopped
    # POSTGRES_DB/USER/PASSWORD from backend/.env (as in the dev stack)
    env_file: backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  app:
    build:
      context: backend
    container_name: dnd-prod-api
    restart: unless-stopped
    working_dir: /app
    env_file: backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Checked with Python because python:3.11-slim has no curl. web and `up --wait` wait for it so that
    # Admin/Wall/Ground do not load before the API is ready.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/scenes', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/}
    container_name: dnd-prod-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
